<!doctype html>
<html lang="en">
<head>

<title>Coin Compass</title>
<style>
:root{--bg:#0E1A22;--surface:#16262F;--surface2:#1D313C;--line:#273C48;--text:#E9F0F3;--muted:#8FA4B0;--accent:#F0B44C;--up:#52C38B;--down:#EA6B64;--warm:#E39A52;--lime:#8FCB6B;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#F2F5F6;--surface:#FFFFFF;--surface2:#E8EFF1;--line:#D5DFE4;--text:#12222B;--muted:#586E7B;--accent:#9A6410;--up:#1B8A57;--down:#C13F38;--warm:#B76A22;--lime:#5F9A35;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.2px}
.top small{display:block;color:var(--muted);font-size:12px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);text-align:center}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
main{padding:14px 14px calc(92px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
h2{font-size:16px;margin:22px 2px 10px;font-weight:700}
h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.muted{color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}
.hero{display:grid;gap:6px;justify-items:center;padding:14px 14px 12px}
.hero svg.gauge{width:100%;max-width:300px;height:auto}
.mood{font-size:30px;font-weight:700;line-height:1;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:8px}
.stats div{background:var(--surface2);border-radius:12px;padding:8px 10px}
.stats span{display:block;font-size:12px;color:var(--muted)}
.stats b{font-size:15px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) 64px auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-height:60px}
.row img,.row .ph{width:36px;height:36px;border-radius:50%;background:var(--surface2);object-fit:cover;display:grid;place-items:center;font-weight:700}
.nm b{display:block}
.nm>span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.px b{display:block}
.chip{display:inline-block;font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.acc{background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--up)}
.chip.watch{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.chip.hold{background:var(--surface2);color:var(--muted)}
.chip.red{background:color-mix(in srgb,var(--down) 22%,transparent);color:var(--down)}
.chip.tag{background:var(--surface2);color:var(--muted);font-weight:500}
.rowwrap{display:grid;gap:0}
.row.ord{grid-template-columns:24px minmax(0,1fr) 44px 44px}
.row.ord .iconbtn:disabled{opacity:.3}
.fcgrid{display:grid;grid-template-columns:minmax(64px,1.1fr) repeat(6,1fr);gap:4px;align-items:stretch;font-variant-numeric:tabular-nums}
.fcgrid .h{font-size:11.5px;color:var(--muted);text-align:center;padding:2px 0}
.fcgrid .c{border-radius:8px;text-align:center;padding:9px 0;font-size:13px;font-weight:600;background:var(--surface2)}
.fcgrid button.sym{font-weight:700;padding:9px 4px;border-radius:8px;min-height:40px}
.fcgrid button.sym.on{background:var(--surface2);color:var(--accent)}
.hz{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.hz:last-child{border:0}
.hz .k{font-weight:700}
.hz .p{font-size:17px;font-weight:700}
.hz .r{font-size:13px;color:var(--muted)}
.bar2{height:6px;border-radius:4px;background:var(--surface2);position:relative;margin:6px 0 2px}
.bar2 i{position:absolute;top:-3px;width:2px;height:12px;background:var(--text)}
.bar2 b{position:absolute;top:0;height:6px;border-radius:4px;background:color-mix(in srgb,var(--accent) 55%,transparent)}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rec .row{border:0;border-radius:0;background:none}
.rec .why{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.rec .acts{display:flex;gap:8px;padding:0 12px 12px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:#14202A;font-weight:650;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.ghost{background:var(--surface2);color:var(--text);font-weight:500}
.btn.danger{background:color-mix(in srgb,var(--down) 22%,transparent);color:var(--down)}
.btn.block{width:100%}
.note{font-size:12.5px;color:var(--muted);margin:10px 2px}
.sig{margin-bottom:10px}
.sig header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sig p{margin:8px 0 6px}
.why-list{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:13.5px}
.why-list li{display:grid;grid-template-columns:30px 1fr;gap:6px}
.why-list b{font-variant-numeric:tabular-nums}
.metrics{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:8px}
.news a{display:block;color:var(--text);text-decoration:none;font-weight:600;line-height:1.3}
.news .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);min-height:40px}
.chips button.on{background:var(--accent);color:#14202A;border-color:var(--accent);font-weight:650}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{display:grid;justify-items:center;gap:2px;padding:9px 0 8px;font-size:11px;color:var(--muted);min-height:56px;text-align:center}
.tabs button.on{color:var(--accent);font-weight:650}
.tabs svg{width:22px;height:22px}
.field{display:grid;gap:6px;margin-bottom:10px}
.field label{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.menu .item{min-height:56px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--text);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto;border:1px solid var(--line)}
.sheet h3{margin:0;font-size:20px}
.sheet .bar{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:10px}
svg.wide{width:100%;height:auto;display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.skel{height:60px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
pre.cfg{white-space:pre-wrap;word-break:break-all;background:var(--surface2);border-radius:10px;padding:10px;font-size:12px;max-height:200px;overflow:auto}
.banner{background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<header class="top">
  <div><h1>Maish Coin Compass</h1><small id="stamp">Loading…</small></div>
  <button class="iconbtn" data-act="refresh" aria-label="Refresh data" id="refreshBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
  </button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="sheet" id="sheet"><div class="bg" data-act="close"></div><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
//#region pure
function rsi(c,n=14){
  if(c.length<n+1)return null;
  let g=0,l=0;
  for(let i=1;i<=n;i++){const d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d}
  g/=n;l/=n;
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}
  return l===0?100:100-100/(1+g/l);
}
function sma(c,n){const s=c.slice(-n);return s.reduce((a,b)=>a+b,0)/s.length}
const ADVICE={
  ACCUMULATE:'Looks cheap and is starting to stabilise. If you buy, spread it over several small purchases rather than one.',
  WATCH:'Getting cheap, but the trend is still weak. If you buy, start small and keep cash for lower prices.',
  HOLD:'No clear edge either way. Keep what you have and wait for a clearer signal.',
  REDUCE:'Stretched or overheated. Consider taking some profit or tightening your stop.'
};
const LABELS={ACCUMULATE:['Accumulate','acc'],WATCH:['Watch','watch'],HOLD:['Hold','hold'],REDUCE:['Reduce','red']};
function computeSignal(c,fng){
  if(!c||c.length<60)return null;
  const last=c[c.length-1],r=rsi(c),m50=sma(c,50),m200=c.length>=200?sma(c,200):null;
  const hi=Math.max(...c.slice(-180)),dd=last/hi-1;
  let s=0;const why=[];
  const add=(p,t)=>{s+=p;why.push({p,t})};
  if(r<30)add(2,`RSI ${r.toFixed(0)}: oversold`);
  else if(r<40)add(1,`RSI ${r.toFixed(0)}: weak, getting cheap`);
  else if(r>70)add(-2,`RSI ${r.toFixed(0)}: overheated`);
  else if(r>60)add(-1,`RSI ${r.toFixed(0)}: warming up`);
  else why.push({p:0,t:`RSI ${r.toFixed(0)}: neutral`});
  if(last>m50)add(1,'Above 50-day average: short trend up');else add(-1,'Below 50-day average: short trend down');
  let vs200=null;
  if(m200){
    vs200=last/m200-1;
    if(vs200>0.4)add(-2,`${(vs200*100).toFixed(0)}% above 200-day average: stretched`);
    else if(vs200>=0)add(1,'Above 200-day average: long trend up');
    else add(-1,`${(-vs200*100).toFixed(0)}% below 200-day average: long trend down`);
  }
  if(dd<=-0.4)add(1,`${(-dd*100).toFixed(0)}% below its 180-day high: deep discount`);
  if(fng!=null){
    if(fng<=20)add(1,`Fear & Greed ${fng}: extreme fear`);
    else if(fng>=75)add(-1,`Fear & Greed ${fng}: greed`);
  }
  const label=s>=3?'ACCUMULATE':s>=1?'WATCH':s>=-1?'HOLD':'REDUCE';
  return{label,score:s,why,rsi:r,vs200,dd,advice:ADVICE[label]};
}
function rsiSeries(c,n=14){
  const out=new Array(c.length).fill(null);
  if(c.length<n+1)return out;
  let g=0,l=0;
  for(let i=1;i<=n;i++){const d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d}
  g/=n;l/=n;out[n]=l===0?100:100-100/(1+g/l);
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;out[i]=l===0?100:100-100/(1+g/l)}
  return out;
}
function smaSeries(c,n){
  const out=new Array(c.length).fill(null);let s=0;
  for(let i=0;i<c.length;i++){s+=c[i];if(i>=n)s-=c[i-n];if(i>=n-1)out[i]=s/n}
  return out;
}
function maxDD(a){let p=a[0],m=0;for(const x of a){p=Math.max(p,x);m=Math.min(m,x/p-1)}return m}
function backtest(c,strat){
  const R=rsiSeries(c),M=smaSeries(c,200),fee=0.001,start=200;
  if(c.length<start+30)return null;
  let pos=0,eq=1,entry=0,eqEntry=1,trades=0,wins=0,inMkt=0;
  const curve=[1],bh=[1];
  for(let i=start+1;i<c.length;i++){
    eq*=1+pos*(c[i]/c[i-1]-1);
    if(pos)inMkt++;
    bh.push(c[i]/c[start]);
    let want=pos;
    if(strat==='trend')want=c[i]>M[i]?1:0;
    else if(pos===0&&R[i]<30)want=1;
    else if(pos===1&&(R[i]>55||(strat==='dipstop'&&c[i]<=entry*0.85)))want=0;
    if(want!==pos){
      eq*=1-fee;
      if(want===1){entry=c[i];eqEntry=eq}
      else{trades++;if(eq>eqEntry)wins++}
      pos=want;
    }
    curve.push(eq);
  }
  if(pos===1){trades++;if(eq>eqEntry)wins++}
  return{ret:eq-1,mdd:maxDD(curve),trades,win:trades?wins/trades:null,inMkt:inMkt/(c.length-start-1),curve,bh,bhRet:bh[bh.length-1]-1,bhMdd:maxDD(bh),days:c.length-start-1};
}
function recPick(m,btc30){
  let s=0;const w=[];
  const c24=m.price_change_percentage_24h_in_currency??m.price_change_percentage_24h??0;
  const c7=m.price_change_percentage_7d_in_currency??0;
  const c30=m.price_change_percentage_30d_in_currency??0;
  if(m.market_cap_rank&&m.market_cap_rank<=25){s+=1;w.push('Top 25 by size')}
  if(c30-btc30>=5){s+=2;w.push(`Beating Bitcoin by ${(c30-btc30).toFixed(0)} points over 30 days`)}
  if(m.ath_change_percentage<=-60&&m.ath_change_percentage>-90){s+=1;w.push(`${Math.abs(m.ath_change_percentage).toFixed(0)}% below its all-time high`)}
  if(m.market_cap&&m.total_volume/m.market_cap>=0.06){s+=1;w.push('Heavily traded')}
  if(c7>-8&&c24>-3){s+=1;w.push('Holding steady this week')}
  if(c24>25||c7>60)s-=3;
  return{s,w};
}
//#endregion

const CG='https://api.coingecko.com/api/v3',BN='https://data-api.binance.vision/api/v3';
const FEEDS=[['CoinDesk','https://www.coindesk.com/arc/outboundfeeds/rss/'],['Cointelegraph','https://cointelegraph.com/rss'],['Decrypt','https://decrypt.co/feed']];
const ALIAS={XRP:'Ripple',BNB:'Binance',BTC:'Bitcoin',ETH:'Ether'};
const DEFAULT_BASE=['bitcoin','ethereum','ripple','binancecoin','solana','tron','dogecoin','cardano','chainlink','avalanche-2'];
const FOMC_NEXT={start:'2026-12-08',end:'2026-12-09'};
const FUND={
  BTC:['Digital money and store of value with a fixed supply of 21 million.','Price follows global liquidity and ETF flows. It pays no yield.'],
  ETH:['Smart-contract network behind DeFi, stablecoins and tokenised assets. Fees are partly burned and holders can stake.','Faster rivals and layer-2 networks split activity away from the main chain.'],
  XRP:['Token and ledger built for fast cross-border payments and settlement, backed by Ripple.','Price reacts strongly to legal and regulatory news and to Ripple’s own decisions.'],
  BNB:['Native token of BNB Chain and the Binance ecosystem: gas, fee discounts, token launches and regular burns.','Tied to Binance’s security, reputation and regulatory pressure.'],
  SOL:['Fast, low-fee network for payments, DeFi, memecoins and consumer apps.','Past outages, concentrated validators and very large swings in both directions.'],
  TRX:['Low-fee network that carries a huge share of USDT transfers, especially in emerging markets.','Depends on stablecoin flows, is fairly centralised and faces regulatory scrutiny.'],
  DOGE:['The original meme coin, used for tipping and small payments.','No strong roadmap, endless supply and sentiment-driven. Deep drawdowns are normal.'],
  ADA:['Research-led proof-of-stake network built around formal methods.','Slow delivery and less DeFi activity than rivals.'],
  LINK:['Oracle network that feeds real-world data and cross-chain messaging to smart contracts, widely used by banks and DeFi.','Value capture depends on staking and fee design. Competing oracle networks exist.'],
  AVAX:['Fast network that lets institutions and games launch their own custom chains.','Activity is concentrated in a few apps and competition is heavy.'],
  TON:['Network linked to Telegram’s huge user base: mini-apps and in-chat payments.','Depends heavily on Telegram and has a bumpy regulatory history.'],
  DOT:['Multichain framework where networks share security.','Developer attention has drifted to rivals and new supply keeps being issued.'],
  LTC:['“Silver to Bitcoin”: fast, cheap payments with a long track record.','Little new development to drive demand.'],
  BCH:['Bitcoin fork aimed at low-fee payments on the main chain.','Small developer base and fading mindshare.'],
  XLM:['Payments network for cross-border transfers and tokenised assets, similar in aim to XRP.','Adoption is concentrated in a few partners.'],
  HBAR:['Enterprise-governed network with low fees and large corporate council members.','Seen as centralised. Price is narrative-driven.'],
  SUI:['Fast network built on the Move language, aimed at gaming and DeFi.','Young ecosystem and scheduled token unlocks add selling pressure.'],
  NEAR:['Scalable network pushing account abstraction and AI-agent apps.','Price leans on narrative more than usage.'],
  UNI:['Largest decentralised exchange. The token governs the protocol.','Unclear how much fee revenue ever reaches token holders.'],
  AAVE:['Largest DeFi lending market. The token governs and backs the safety module.','Smart-contract bugs and mass-liquidation events.'],
  HYPE:['Token of Hyperliquid, an on-chain exchange for perpetual futures that uses fees for buybacks.','Concentrated ecosystem, regulatory risk and strong competition.']
};
const NOISE=/usd|dai\b|wrapped|staked|bridged|restaked|steth|wbtc|weth|tether|peg|treasury|bridge|gold|cash/i;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('cc.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('cc.'+k,JSON.stringify(v))}catch{}}};
const S={base:store.get('base',DEFAULT_BASE),alerts:store.get('alerts',[]),pf:store.get('pf',[]),skip:store.get('skip',[]),ntfy:store.get('ntfy',''),notifyOn:store.get('notifyOn',false),
  mk:{},top:[],glob:null,fng:null,fngHist:[],candles:{},sig:{},news:[],tab:'market',sub:null,newsFilter:'ALL',updated:null,loading:false,bt:null,swReg:null,sheet:null,fc:null,fcCoin:null,fcMissing:false,reorder:false};

const fp=p=>p==null?'–':p>=1000?p.toLocaleString('en-US',{maximumFractionDigits:0}):p>=1?p.toFixed(2):p>=0.01?p.toFixed(4):p.toFixed(6);
const pc=x=>x==null?'<span class="muted">–</span>':`<span class="${x>=0?'up':'down'}">${x>=0?'+':''}${x.toFixed(1)}%</span>`;
const big=n=>n==null?'–':n>=1e12?(n/1e12).toFixed(2)+'T':n>=1e9?(n/1e9).toFixed(1)+'B':(n/1e6).toFixed(0)+'M';
const ago=ts=>{const m=Math.max(1,Math.round((Date.now()/1000-ts)/60));return m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
const c24=m=>m?(m.price_change_percentage_24h_in_currency??m.price_change_percentage_24h):null;
const c7=m=>m?m.price_change_percentage_7d_in_currency:null;
const chip=s=>{if(!s)return '<span class="chip hold">…</span>';const[l,k]=LABELS[s.label];return `<span class="chip ${k}">${l}</span>`};
const fngLabel=v=>v<=24?'Extreme fear':v<=44?'Fear':v<=55?'Neutral':v<=75?'Greed':'Extreme greed';

async function fj(url,ms=12000){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function cached(key,ttl,fn){const c=store.get('c.'+key,null);if(c&&Date.now()-c.t<ttl)return c.v;try{const v=await fn();store.set('c.'+key,{t:Date.now(),v});return v}catch(e){if(c)return c.v;throw e}}

function spark(v,w,h,up,wide){
  if(!v||v.length<2)return `<svg width="${w}" height="${h}" aria-hidden="true"></svg>`;
  const mn=Math.min(...v),mx=Math.max(...v),d=mx-mn||1;
  const pts=v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-2-(x-mn)/d*(h-4)).toFixed(1)}`).join(' ');
  const col=up?'var(--up)':'var(--down)';
  return `<svg ${wide?'class="wide"':`width="${w}" height="${h}"`} viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" style="stroke:${col}" stroke-width="${wide?2:1.6}" stroke-linejoin="round"/></svg>`;
}
function gauge(v){
  const cx=110,cy=104,r=84;
  const pt=(val,rad=r)=>{const a=Math.PI*(1-val/100);return[cx+rad*Math.cos(a),cy-rad*Math.sin(a)]};
  const arc=(a,b,col)=>{const p=pt(a+.5),q=pt(b-.5);return `<path d="M${p[0].toFixed(1)} ${p[1].toFixed(1)}A${r} ${r} 0 0 1 ${q[0].toFixed(1)} ${q[1].toFixed(1)}" style="stroke:${col}" stroke-width="14" fill="none"/>`};
  const zones=[[0,25,'var(--down)'],[25,45,'var(--warm)'],[45,55,'var(--muted)'],[55,75,'var(--lime)'],[75,100,'var(--up)']];
  let s=`<svg class="gauge" viewBox="0 0 220 118" role="img" aria-label="Fear and Greed index ${v??'loading'}">`+zones.map(z=>arc(...z)).join('');
  if(v!=null){const q=pt(v,r-24);s+=`<line x1="${cx}" y1="${cy}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" style="stroke:var(--text)" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" style="fill:var(--text)"/>`}
  return s+'</svg>';
}

/* ---------- data ---------- */
function isNoise(m){return NOISE.test(m.name)||NOISE.test(m.id)||(m.current_price>0.97&&m.current_price<1.03&&m.price_change_percentage_30d_in_currency!=null&&Math.abs(m.price_change_percentage_30d_in_currency)<2)}
async function loadMarkets(){
  const ids=S.base.join(',');
  const [own,top]=await Promise.allSettled([
    cached('mk.base.'+[...S.base].sort().join(','),120000,()=>fj(`${CG}/coins/markets?vs_currency=usd&ids=${ids}&order=market_cap_desc&sparkline=true&price_change_percentage=24h,7d,30d`)),
    cached('mk.top',180000,()=>fj(`${CG}/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=true&price_change_percentage=24h,7d,30d`))]);
  if(top.status==='fulfilled'){S.top=top.value;top.value.forEach(c=>S.mk[c.id]=c)}
  if(own.status==='fulfilled')own.value.forEach(c=>S.mk[c.id]=c);
  if(own.status==='rejected'&&top.status==='rejected')throw new Error('markets');
}
async function loadMacro(){
  const[g,f]=await Promise.allSettled([
    cached('glob',300000,()=>fj(`${CG}/global`)),
    cached('fng',1800000,()=>fj('https://api.alternative.me/fng/?limit=30'))]);
  if(g.status==='fulfilled')S.glob=g.value.data;
  if(f.status==='fulfilled'){
    const d=f.value.data;
    S.fng={value:+d[0].value,label:fngLabel(+d[0].value)};
    S.fngHist=d.map(x=>+x.value).reverse();
  }
}
function stripHtml(h){return String(h||'').replace(/<[^>]*>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim()}
async function fetchFeed([name,url]){
  try{
    const j=await fj(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
    if(j.status==='ok'&&j.items?.length)return j.items.map(i=>({title:i.title,url:i.link,source:name,published_on:Date.parse(String(i.pubDate||'').replace(' ','T')+'Z')/1000||Date.now()/1000,body:stripHtml(i.description)}));
  }catch{}
  try{
    const r=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
    const x=new DOMParser().parseFromString(await r.text(),'text/xml');
    return[...x.querySelectorAll('item')].slice(0,20).map(i=>({title:i.querySelector('title')?.textContent||'',url:i.querySelector('link')?.textContent||'',source:name,published_on:Date.parse(i.querySelector('pubDate')?.textContent||'')/1000||Date.now()/1000,body:stripHtml(i.querySelector('description')?.textContent)}));
  }catch{return[]}
}
async function loadNews(){
  try{
    S.news=await cached('news3',900000,async()=>{
      const all=(await Promise.all(FEEDS.map(fetchFeed))).flat().filter(n=>n.title&&n.url);
      if(!all.length)throw new Error('no news');
      const seen=new Set();
      return all.sort((a,b)=>b.published_on-a.published_on).filter(n=>!seen.has(n.url)&&seen.add(n.url)).slice(0,80);
    });
  }catch{}
}
function mentions(n,m){
  const sym=m.symbol.toUpperCase(),t=n.title+' '+(n.body||''),esc2=x=>x.replace(/[^\w ]/g,'');
  const names=[m.name,ALIAS[sym]].filter(Boolean);
  return new RegExp('\\b'+esc2(sym)+'\\b').test(t)||names.some(x=>new RegExp('\\b'+esc2(x)+'\\b','i').test(t));
}
function sigFor(id){
  const c=S.candles[id];if(!c)return null;
  const a=c.slice();const m=S.mk[id];
  if(m&&m.current_price)a[a.length-1]=m.current_price;
  return computeSignal(a,S.fng?S.fng.value:null);
}
async function dailyCloses(m,total){
  const sym=m.symbol.toUpperCase();
  try{
    let out=[],end=null;
    while(out.length<total){
      const lim=Math.min(1000,total-out.length);
      const j=await fj(`${BN}/klines?symbol=${sym}USDT&interval=1d&limit=${lim}${end?`&endTime=${end}`:''}`);
      if(!Array.isArray(j)||!j.length)break;
      out=j.map(k=>+k[4]).concat(out);end=j[0][0]-1;
      if(j.length<lim)break;
    }
    out=out.filter(x=>x>0);
    if(out.length>=60)return out;
  }catch{}
  const j=await fj(`${CG}/coins/${m.id}/market_chart?vs_currency=usd&days=${Math.min(total,365)}&interval=daily`);
  const c=(j.prices||[]).map(p=>p[1]).filter(x=>x>0);
  if(c.length<60)throw new Error('no history');
  return c.slice(-total);
}
async function loadCandles(ids){
  const q=[...ids];
  const worker=async()=>{
    while(q.length){
      const id=q.shift(),m=S.mk[id];if(!m)continue;
      try{S.candles[id]=await cached('cd2.'+id,7200000,()=>dailyCloses(m,210))}catch{}
      S.sig[id]=sigFor(id);
      render();
    }
  };
  await Promise.all([worker(),worker(),worker()]);
}
async function loadAll(){
  if(S.loading)return;
  S.loading=true;$('#refreshBtn svg').classList.add('spin');render();
  try{
    await loadMarkets();
    await Promise.all([loadMacro(),loadNews(),loadForecast()]);
    S.updated=new Date();render();
    await loadCandles(S.base);
    checkAlerts();
  }catch(e){toast('Could not load prices. Check your connection and tap refresh.')}
  S.loading=false;$('#refreshBtn svg').classList.remove('spin');render();
}

/* ---------- alerts in the app ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4200)}
function notify(title,body,tag){
  toast(title+': '+body);
  if(S.notifyOn&&'Notification' in window&&Notification.permission==='granted'){
    try{if(S.swReg)S.swReg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag});else new Notification(title,{body})}catch{}
  }
}
function checkAlerts(){
  let changed=false;
  S.alerts.forEach(a=>{
    const m=S.mk[a.id];if(!m)return;
    const p=m.current_price,hit=a.dir==='above'?p>=a.price:p<=a.price;
    if(hit&&!a.fired){a.fired=true;changed=true;notify(`${m.symbol.toUpperCase()} ${a.dir==='above'?'rose above':'fell below'} $${fp(a.price)}`,`Now $${fp(p)}`,'px-'+a.id+a.price)}
    else if(!hit&&a.fired){a.fired=false;changed=true}
  });
  const prev=store.get('labels',{});const next={};
  S.base.forEach(id=>{
    const s=S.sig[id];if(!s)return;next[id]=s.label;
    if(prev[id]&&prev[id]!==s.label&&(s.label==='ACCUMULATE'||s.label==='REDUCE')){
      notify(`${S.mk[id].symbol.toUpperCase()}: ${LABELS[s.label][0]}`,s.advice,'sig-'+id);
    }
  });
  store.set('labels',{...prev,...next});
  if(changed)store.set('alerts',S.alerts);
}

    <details class="card" style="margin-bottom:12px"><summary style="cursor:pointer;min-height:28px"><b>What do RSI and the +1 / −1 points mean?</b></summary>
    <p style="margin:10px 0 6px"><b>RSI</b> (Relative Strength Index) is a 0 to 100 reading of how fast price has moved over the last 14 days. Under 30 means it has been sold hard (oversold, may be cheap). Over 70 means it has run up fast (overheated). 40 to 60 is calm.</p>

function tagsFor(t){
  const tags=[];
  if(/hack|exploit|breach|stolen|drain/i.test(t))tags.push('Security');
  if(/\bsec\b|lawsuit|ban\b|regulat|approv|etf|court|bill\b/i.test(t))tags.push('Regulation / ETF');
  if(/\bfed\b|rate|inflation|cpi|tariff|yield|dollar/i.test(t))tags.push('Macro');
  if(/launch|upgrade|mainnet|partner|integrat|listing/i.test(t))tags.push('Product');
  return tags;
}

const HZS=['1h','3h','6h','12h','24h','7d'];
async function loadForecast(){
  try{
    const r=await fetch('forecasts.json?'+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j||!j.coins)throw new Error('empty');
    S.fc=j;S.fcMissing=false;
  }catch{if(!S.fc)S.fcMissing=true}
}
function headlineMult(id){
  const m=S.mk[id];if(!m)return 1;
  const cut=Date.now()/1000-86400,recent=S.news.filter(n=>n.published_on>=cut);
  const hot=n=>tagsFor(n.title).some(t=>t!=='Product');
  const own=recent.filter(n=>mentions(n,m)&&hot(n));
  const sec=own.some(n=>tagsFor(n.title).includes('Security'));
  const macro=recent.filter(n=>tagsFor(n.title).includes('Macro')).length;
  return(own.length>=2||sec||macro>=4)?1.25:1;
}
const lean=p=>{const d=p-0.5,a=Math.abs(d);return a<0.03?{t:'No edge',c:'muted'}:{t:(a<0.06?'Slight lean ':'Lean ')+(d>0?'up':'down'),c:d>0?'up':'down'}};
const tint=p=>`background:color-mix(in srgb,var(${p>=0.5?'--up':'--down'}) ${(Math.min(Math.abs(p-0.5)/0.12,1)*55).toFixed(0)}%,var(--surface2))`;
const rp=v=>(v>=0?'+':'−')+(Math.abs(v)*100).toFixed(Math.abs(v)<0.1?1:0)+'%';
function widen(q,k){const md=q[2];return q.map(v=>md+(v-md)*k)}
function fcView(){
  const F=S.fc;
  if(!F)return S.fcMissing?`<div class="banner"><b>No forecasts yet.</b> In your GitHub repo open <b>Actions</b>, choose <b>coin-compass-forecast</b>, tap <b>Run workflow</b>, wait about 2 minutes, then tap refresh here.</div>`:'<div class="empty">Loading forecasts…</div>';
  const ids=S.base.filter(id=>F.coins[id]);
  const age=Math.round((Date.now()-Date.parse(F.generated_at))/60000);
  let h=`<div class="banner">These are <b>probabilities, not predictions</b>. Short-term crypto moves are mostly noise, so many readings will say “No edge”, and that is the honest answer. Check the track record below before leaning on any of it. Information only, not financial advice.</div>`;
  h+=`<p class="note" style="margin-top:0">Model run ${new Date(F.generated_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} (${age<90?age+' min':Math.round(age/60)+' h'} ago)${age>180?' — <b class="down">stale, check the Actions tab</b>':''}</p>`;
  if(!ids.length)return h+'<div class="empty">No base coins in the latest run yet.</div>';
  const sel=ids.includes(S.fcCoin)?S.fcCoin:ids[0];
  h+=`<section class="card"><b>Chance of being higher than now</b><p class="note" style="margin:2px 0 10px">Green leans up, red leans down, grey means no clear edge. Tap a coin for ranges.</p>
   <div class="fcgrid"><span></span>${HZS.map(k=>`<span class="h">${k}</span>`).join('')}${ids.map(id=>{const c=F.coins[id];return `<button class="sym ${id===sel?'on':''}" data-act="fcc" data-id="${esc(id)}">${esc(c.symbol)}</button>`+HZS.map(k=>{const f=c.h[k];return f?`<span class="c" style="${tint(f.p)}">${Math.round(f.p*100)}%</span>`:'<span class="c muted">–</span>'}).join('')}).join('')}</div></section>`;
  const c=F.coins[sel],mult=headlineMult(sel),m=S.mk[sel];
  h+=`<h2>${esc(m?m.name:c.symbol)}<small>at run time $${fp(c.price)}</small></h2><section class="card">`;
  if(mult>1)h+=`<div class="banner" style="margin-bottom:6px"><b>Headline risk is elevated.</b> Recent news (security, regulation or macro) makes bigger swings more likely, so the ranges below are widened by 25%.</div>`;
  h+=HZS.map(k=>{
    const f=c.h[k];if(!f)return '';
    const q=widen(f.q,mult),L=lean(f.p),lo=q[0],hi=q[4],span=(hi-lo)||1,pos=v=>Math.max(0,Math.min(100,(v-lo)/span*100));
    return `<div class="hz"><div class="k">${k}</div><div><div class="p">${Math.round(f.p*100)}% <span class="${L.c}" style="font-size:13px;font-weight:600">${L.t}</span></div>
     <div class="r">Likely range <b style="color:var(--text)">${rp(q[1])} to ${rp(q[3])}</b> ($${fp(c.price*(1+q[1]))} to $${fp(c.price*(1+q[3]))})</div>
     <div class="bar2" aria-hidden="true"><b style="left:${pos(q[1]).toFixed(0)}%;width:${(pos(q[3])-pos(q[1])).toFixed(0)}%"></b><i style="left:${pos(0).toFixed(0)}%"></i></div>
     <div class="r">Wide range ${rp(q[0])} to ${rp(q[4])}</div></div></div>`}).join('');
  h+='</section>';
  const mo=F.model||{},lv=F.live||{};
  const vs=ids.filter(id=>F.coins[id].vol).sort((a,b)=>F.coins[b].vol.ratio-F.coins[a].vol.ratio);
  if(vs.length){
    h+=`<h2>Ranges right now<small>vs each coin’s normal</small></h2><section class="card">`+vs.map(id=>{
      const c=F.coins[id],v=c.vol,tag=v.ratio>=1.6?'<span class="chip red">Wide</span>':v.ratio>=1.25?'<span class="chip watch">Widening</span>':v.ratio<=0.75?'<span class="chip hold">Quiet</span>':'<span class="chip hold">Normal</span>';
      return `<div class="item"><span><b>${esc(c.symbol)}</b> ${tag}</span><span class="muted" style="text-align:right">${v.ratio.toFixed(1)}× normal · typical 24h move ±${(v.move24*100).toFixed(1)}%</span></div>`}).join('')+
      `<p class="note" style="margin-bottom:0">“Wide” means a coin is swinging much harder than usual, so big gains and big drops are both more likely. Volatility is the most reliable thing the model measures.</p></section>`;
  }
  const ns=ids.filter(id=>F.coins[id].noise&&Math.abs(F.coins[id].noise.z)>=2);
  if(ids.some(id=>F.coins[id].noise)){
    h+=`<h2>Noise board<small>stretched moves</small></h2><section class="card">`+(ns.length?ns.map(id=>{
      const c=F.coins[id],n=c.noise,up=n.z>0;
      return `<div class="item" style="align-items:flex-start"><span><b>${esc(c.symbol)}</b> <span class="chip ${up?'acc':'red'}">${up?'Stretched up':'Stretched down'}</span></span><span class="muted" style="text-align:right;max-width:64%">${Math.abs(n.z).toFixed(1)}× its normal wobble over 6h. ${n.rate!=null?`After similar stretches the move partly reversed ${Math.round(n.rate*100)}% of the time (${n.n} cases, average giveback ${(n.avg*100).toFixed(2)}%).`:'Too few past cases to judge.'}</span></div>`}).join(''):'<div class="empty" style="padding:12px">Nothing is unusually stretched right now.</div>')+
      `<p class="note" style="margin-bottom:0">“Noise” means a move bigger than a coin’s usual wobble. Such moves often give part of themselves back within hours, but round-trip fees are about 0.2%, which can swallow a small bounce. It is a clue, not a trade signal.</p></section>`;
  }
  h+=`<h2>Track record<small>how right has it been?</small></h2><section class="card"><div class="fcgrid" style="grid-template-columns:44px 1fr 1fr 1fr;gap:6px 8px"><span></span><span class="h">Tested</span><span class="h">Vs coin-flip</span><span class="h">Live</span>`+HZS.map(k=>{
    const t=mo[k],l=lv[k];if(!t)return `<b>${k}</b><span class="c muted">–</span><span class="c muted">–</span><span class="c muted">–</span>`;
    const edge=(t.acc-t.acc_base)*100;
    return `<b style="align-self:center">${k}</b><span class="c">${(t.acc*100).toFixed(1)}%</span><span class="c ${edge>=1.5?'up':edge<=-1.5?'down':'muted'}">${edge>=0?'+':'−'}${Math.abs(edge).toFixed(1)} pts</span><span class="c ${l&&l.n?'':'muted'}">${l&&l.n?`${Math.round(l.hits/l.n*100)}% (${l.n})`:'–'}</span>`}).join('')+'</div>';
  const cv=HZS.map(k=>mo[k]).filter(Boolean);
  if(cv.length)h+=`<p class="note">Range check on unseen history: the 50% range held ${(cv.reduce((a,t)=>a+t.cov50,0)/cv.length*100).toFixed(0)}% of the time and the 90% range ${(cv.reduce((a,t)=>a+t.cov90,0)/cv.length*100).toFixed(0)}%, as intended.</p>`;
  h+=`<p class="note"><b>Tested</b> = how often the up/down call was right on recent history the model never saw. <b>Vs coin-flip</b> = how many points better than always guessing the more common outcome. <b>Live</b> = real forecasts scored after the fact${F.since?`, since ${esc(F.since)}`:''}, with the number scored in brackets. A gap of a point or two is small, so only trust it once the live count is in the hundreds and still positive.</p></section>`;
  h+=`<details class="card" style="margin-top:12px"><summary style="cursor:pointer;min-height:28px"><b>How does this work?</b></summary>
   <p style="margin:10px 0 6px"><b>Inputs.</b> For each coin the model reads momentum over several windows (1 hour to 1 week), how calm or wild the market is compared with normal, RSI, how far price sits from its weekly average, what Bitcoin is doing and the Fear &amp; Greed index. Each is scaled by that coin’s own volatility so one model can learn from all your coins at once.</p>
   <p style="margin:6px 0"><b>The model.</b> A simple logistic regression, one per time horizon. It learns from history how often price was higher afterwards when the inputs looked like they do now, and outputs a probability. It is kept deliberately simple and heavily dampened so it does not memorise noise.</p>
   <p style="margin:6px 0"><b>The ranges.</b> Width comes from current volatility, calibrated on history, so calm markets give narrow ranges and wild ones give wide ranges. Volatility is the part of the future that is actually predictable.</p>
   <p style="margin:6px 0"><b>News.</b> Headlines cannot be tested against years of history here, so they do not move the up/down odds. Instead, security, regulation and macro headlines widen the ranges, because news raises the chance of big moves in either direction.</p>
   <p style="margin:6px 0"><b>Honesty check.</b> Every hour the forecasts are saved and scored when their time arrives. That live record is the real test. Surprise events, such as a hack or a sudden Fed move, can break any model.</p></details>`;
  return h;
}

async function runBacktest(){
  const id=$('#bt-coin').value,strat=$('#bt-strat').value,m=S.mk[id];
  const names={dip:'Buy dips',dipstop:'Buy dips with stop-loss',trend:'200-day trend'};
  S.bt='loading';render();
  try{
    const c=await dailyCloses(m,2000);
    const r=backtest(c,strat);
    S.bt=r?{r,name:`${m.name}: ${names[strat]}`}:{err:'Not enough history for this coin.'};
  }catch{S.bt={err:'Could not load history. Check your connection and try again.'}}
  render();
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='tab'){S.tab=el.dataset.t;S.sub=null;render();scrollTo(0,0)}
  else if(a==='sub'){S.sub=el.dataset.s||null;render();scrollTo(0,0)}
  else if(a==='refresh')loadAll();
  else if(a==='coin')openCoin(id);
  else if(a==='close')closeSheet();
  else if(a==='nf'){S.newsFilter=el.dataset.f;render()}
  else if(a==='fcc'){S.fcCoin=id;render()}
  else if(a==='adopt'){if(!S.base.includes(id)){setBase([...S.base,id]);toast(`${S.mk[id].name} added to your base coins`);closeSheet();await loadMarkets();render();loadCandles([id])}}
  else if(a==='reorder'){S.reorder=!S.reorder;render()}
  else if(a==='mv'){const i=S.base.indexOf(id),j=i+(+el.dataset.d);if(i>-1&&j>=0&&j<S.base.length){const b=[...S.base];[b[i],b[j]]=[b[j],b[i]];setBase(b);render()}}
  else if(a==='skip'){S.skip=[...S.skip,id];store.set('skip',S.skip);render()}
  else if(a==='remove'){setBase(S.base.filter(x=>x!==id));closeSheet();render()}
  else if(a==='resetbase'){setBase(DEFAULT_BASE);S.skip=[];store.set('skip',[]);render();loadAll()}
  else if(a==='wipe'){if(confirm('Clear base coins, alerts and portfolio saved on this phone?')){Object.keys(localStorage).filter(k=>k.startsWith('cc.')).forEach(k=>localStorage.removeItem(k));location.reload()}}
  else if(a==='addalert'||a==='sheetalert'){
    const coin=a==='sheetalert'?id:$('#al-coin')?.value,dir=a==='sheetalert'?$('#sa-dir').value:$('#al-dir').value,px=a==='sheetalert'?num('sa-px'):num('al-px');
    if(!coin||!(px>0)){toast('Enter a price above 0');return}
    S.alerts.push({id:coin,dir,price:px,fired:false});store.set('alerts',S.alerts);toast('Alert added');if(a==='sheetalert')closeSheet();render();
  }
  else if(a==='delalert'){S.alerts.splice(+el.dataset.i,1);store.set('alerts',S.alerts);render()}
  else if(a==='notifyon'){
    if(!('Notification' in window)){toast('This browser does not support notifications');return}
    const p=await Notification.requestPermission();S.notifyOn=p==='granted';store.set('notifyOn',S.notifyOn);toast(S.notifyOn?'Phone notifications on':'Notifications were not allowed');render();
  }
  else if(a==='ntfysave'){S.ntfy=($('#ntfy').value||'').trim();store.set('ntfy',S.ntfy);toast('Topic saved')}
  else if(a==='ntfytest'){
    const t=($('#ntfy').value||'').trim();if(!t){toast('Enter your ntfy topic first');return}
    S.ntfy=t;store.set('ntfy',t);
    try{const r=await fetch('https://ntfy.sh/'+encodeURIComponent(t),{method:'POST',body:'Test from Coin Compass. Alerts are working.'});toast(r.ok?'Test sent. Check the ntfy app.':'Could not send the test')}catch{toast('Could not send the test')}
  }
  else if(a==='cfg'){
    const cfg=JSON.stringify({base:S.base,alerts:S.alerts.map(x=>({id:x.id,[x.dir]:x.price})),move_pct:7,brief_hour_utc:6,strong_lean:0.06,wide_ratio:1.6,lean_requires_edge:true,noise_alerts:true},null,2);
    try{await navigator.clipboard.writeText(cfg);toast('Copied. Paste it into config.json on GitHub.')}catch{prompt('Copy this into config.json:',cfg)}
  }
  else if(a==='btrun')runBacktest();
  else if(a==='pfadd'){
    const coin=$('#pf-coin')?.value,amt=num('pf-amt'),px=num('pf-px');
    if(!coin||!(amt>0)||!(px>0)){toast('Enter an amount and price above 0');return}
    S.pf.push({id:coin,amt,px});store.set('pf',S.pf);render();
  }
  else if(a==='pfdel'){S.pf.splice(+el.dataset.i,1);store.set('pf',S.pf);render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!S.updated||Date.now()-S.updated>300000))loadAll()});
setInterval(()=>{if(!document.hidden)loadAll()},300000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>S.swReg=r).catch(()=>{});
render();loadAll();
</script>
</body>
